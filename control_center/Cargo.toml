[package]
name = "control_center"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "control_center"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
nano_harness = { path = ".." }
tokio = { version = "1", features = ["time"] }
