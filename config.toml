# ============================================================================
# nano_harness — полный конфиг со всеми параметрами
# ============================================================================

# ---------------------------------------------------------------------------
# Глобальные параметры LLM (используются CLI-чатом и как fallback для агентов)
# ---------------------------------------------------------------------------
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"

temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning: "low" | "medium" | "high" (зависит от модели)
reasoning_effort = "medium"

# Лимит бюджета в рублях; при превышении send() вернёт ошибку
max_cost_rub = 10.0

# Ограничение контекста: сколько первых пар (запрос-ответ) закреплять в префиксе,
# сколько последних держать в хвосте.
prefix_message_count = 4
tail_message_count = 6

# Максимальное число итераций LLM в одном ходу чата (с tool-calls)
max_iterations = 3

# Таймаут HTTP-запроса к LLM в секундах.
# Агенты наследуют это значение, если у них не задан свой timeout_sec.
timeout_sec = 600

# Глобальный системный промпт для CLI-чата (не для агентов)
system_prompt = """Ты — полезный ассистент. Работаешь с локальным файловым хранилищем 
и можешь вызывать других агентов через инструменты.

АГЕНТЫ:

Агент: analyzer
Назначение: анализ проектов — структура каталогов, стек технологий, 
назначение файлов, зависимости. Обращайся, когда пользователь просит 
проанализировать проект, разобраться в структуре, выяснить технологии.

Если пользователь называет конкретного агента — вызывай его. Если нет — 
выбирай по смыслу задачи.
"""

# Редактор для команды /rebuke_edit. Если не задан — $EDITOR, иначе notepad (Windows) / vi.
editor = "notepad"

# ---------------------------------------------------------------------------
# Авто-инжект знаний в контекст.
# Перед каждым ходом (чат или агент) платформа:
#   1. прогоняет текущий ход через YAKE и получает top_n ключевых фраз;
#   2. ищет по каждой фразе в базе знаний, берёт top_k (= vector_db.top_k) результатов;
#   3. отсеивает результаты с distance > threshold;
#   4. агрегирует по файлам-знаниям и берёт top_k знаний;
#   5. склеивает их тела в одно system-сообщение и кладёт в слот.
#
# threshold откалиброван на модели paraphrase-multilingual-MiniLM-L12-v2:
#   точно про знание    → 0.38 – 0.49
#   смежно              → 0.63 – 0.67
#   мимо                → 0.77+
# Граница — 0.70.
# ---------------------------------------------------------------------------
knowledge_auto_top_n = 7
knowledge_auto_top_k = 3
knowledge_auto_threshold = 0.70

# ---------------------------------------------------------------------------
# Скиллы: поиск по фразам YAKE.
# 1. YAKE по скиллу и по запросу.
# 2. Оставляем только фразы из >= skill_phrase_min_words слов.
# 3. По каждой фразе запроса — поиск по фразам скилла, порог skill_search_threshold.
# 4. Считаем hits — сколько фраз запроса нашли фразу скилла в пороге.
# 5. Если hits >= skill_min_hits — скилл найден.
# ---------------------------------------------------------------------------
skill_mode = "auto"
skill_min_tool_calls = 2
skill_phrases_top_n = 15
skill_phrase_min_words = 2
skill_search_threshold = 0.45
skill_min_hits = 3

# ---------------------------------------------------------------------------
# Поиск инструментов по промпту.
# 1. YAKE по промпту → top_n ключевых фраз.
# 2. Оставляем только фразы из >= phrase_min_words слов.
# 3. По каждой фразе — поиск по `_tools/<name>.md`.
# 4. Отсев по distance > threshold и по allowed_tools из конфига.
# 5. Агрегация hits и min_distance по имени тулза.
# 6. score = (1 - min_distance) * hits / (hits + 0.5)
# 7. Пул = {текущие слоты} ∪ {кандидаты}. Top-N (N = slots) по score.
# ---------------------------------------------------------------------------
tools_search_top_n = 7
tools_search_phrase_min_words = 2
tools_search_threshold = 0.45
tools_search_slots = 4

# ---------------------------------------------------------------------------
# Разрешённые инструменты на верхнем уровне (используется CLI-чатом).
# Для агентов список tools задаётся внутри каждого [[agents]].
# ---------------------------------------------------------------------------
[[tools]]
name = "storage_read_file"
mode = "auto"

[[tools]]
name = "storage_write_file"
mode = "auto"

[[tools]]
name = "storage_delete_file"
mode = "auto"

[[tools]]
name = "storage_create_dir"
mode = "auto"

[[tools]]
name = "storage_list_dir"
mode = "auto"

[[tools]]
name = "storage_walk"
mode = "auto"

[[tools]]
name = "storage_search_by_name"
mode = "auto"

[[tools]]
name = "storage_search_similar"
mode = "auto"

[[tools]]
name = "storage_read_about"
mode = "auto"

[[tools]]
name = "storage_write_about"
mode = "auto"

[[tools]]
name = "storage_read_summary"
mode = "auto"

[[tools]]
name = "storage_write_summary"
mode = "auto"

[[tools]]
name = "call_agent"
mode = "auto"

[[tools]]
name = "post_task"
mode = "auto"

[[tools]]
name = "ripgrep"
mode = "auto"

[[tools]]
name = "scc"
mode = "auto"

[[tools]]
name = "ctags"
mode = "auto"

[[tools]]
name = "code_index"
mode = "auto"

# ---------------------------------------------------------------------------
# Векторная база (эмбеддинги для семантического поиска по хранилищу)
# ---------------------------------------------------------------------------
[vector_db]
model_path = ".models/paraphrase-multilingual-MiniLM-L12-v2"
tokenizer_path = ".models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json"
chunk_size = 512
chunk_overlap = 64
top_k = 5

# ---------------------------------------------------------------------------
# Локальное файловое хранилище (сервис local_storage_http_server)
# ---------------------------------------------------------------------------
[local_storage_http_server]
bind_addr = "127.0.0.1:8080"
storage_name = "default_storage"
auth_token = ""

# ---------------------------------------------------------------------------
# Доска сообщений (сервис message_board_server)
# ---------------------------------------------------------------------------
[message_board]
bind_addr = "127.0.0.1:8090"
auth_token = ""
tasks_dir = ".board/tasks"
task_timeout_sec = 300

# ============================================================================
# Godfather — семантическая компактизация контекста по команде /godfather.
# Если api_key пустой, godfather отключён, /godfather делает только
# механическую компактизацию.
# ============================================================================
[godfather]
model = "google/gemini-3.1-flash-lite"
api_key = ""
base_url = "https://polza.ai/api/v1"
temperature = 0.3
max_tokens = 8192
prompt = """Ты — редактор истории диалога. Тебе дают последовательность сообщений между пользователем и ассистентом.
Твоя задача — переписать эту историю короче, сохранив смысл.

СОХРАНЯЙ:
- Все реплики пользователя по сути (что он просил, что уточнял, что отверг).
- Все содержательные ответы ассистента (что предложил, что сделал, к какому выводу пришёл).
- Ключевые факты, числа, имена, пути, идентификаторы.
- Договорённости и принятые решения.
- Текущее состояние задачи, если она ещё в работе.

УБИРАЙ:
- Повторы одной и той же мысли в разных формулировках.
- Промежуточные рассуждения, которые не повлияли на результат.
- Гипотезы, которые были отвергнуты и забыты.
- Извинения, вежливые обороты, воду.
- Служебные вставки, не несущие смысла.

ПРАВИЛА:
- Не выдумывай ничего, чего не было в исходной истории.
- Не добавляй свои комментарии, оценки или объяснения.
- Если не уверен, что фрагмент можно безболезненно убрать — оставь его.
- Объединяй подряд идущие реплики одной роли в одну, если это не искажает смысл.
- Итоговая длина должна быть меньше исходной. Если сжать не удаётся — верни исходную историю без изменений.

О СЛУЖЕБНЫХ СООБЩЕНИЯХ:
Сообщения с ролью "tool" и служебные вставки будут представлены тебе как текст вида [инструмент: ...] или [результат инструмента: ...]. Их не нужно сохранять дословно — если результат был важен, упомяни его в ответе ассистента своими словами, иначе опусти.

ФОРМАТ ОТВЕТА:
Верни строго строку с JSON-массивом объектов, без пояснений и без markdown-обёртки.
Каждый объект имеет два поля: "role" (только "user" или "assistant") и "content" (строка с текстом).
Никаких других полей, никаких комментариев.

Пример:
[
  {"role": "user", "content": "Пользователь попросил проанализировать проект в каталоге project."},
  {"role": "assistant", "content": "Ассистент прочитал структуру проекта через storage_walk, исключил .git, сформировал отчёт PROJECT_ANALYSIS.txt с описанием модулей на Rust."},
  {"role": "user", "content": "Пользователь попросил добавить анализ зависимостей из Cargo.toml."},
  {"role": "assistant", "content": "Ассистент добавил в отчёт список зависимостей и их назначение."}
]
"""

# ============================================================================
# Агент 1 — assistant
# ============================================================================
[[agents]]
name = "analyzer"
api_key = ""
bind_addr = "127.0.0.1:8081"
auth_token = ""

# Таймаут HTTP-запроса к LLM (в секундах)
timeout_sec = 120

# Максимальное число итераций LLM в одном запросе (с tool-calls)
max_iterations = 3

# Разрешённые инструменты для этого агента
tools = [
  "storage_read_file",
  "storage_write_file",
  "storage_delete_file",
  "storage_create_dir",
  "storage_list_dir",
  "storage_walk",
  "storage_search_by_name",
  "storage_search_similar",
  "storage_read_about",
  "storage_write_about",
  "storage_read_summary",
  "storage_write_summary",
  "call_agent",
  "post_task",
  "ripgrep",
  "scc",
  "ctags",
  "code_index",
]

# Системный промпт агента (переопределяет глобальный)
system_prompt = """Ты — помощник для работы с файлами и анализа проектов.

Анализируй структуру каталогов, определяй используемые технологии, 
понимай назначение файлов.
"""

# Параметры LLM для этого агента
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"
temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning (опционально)
reasoning_effort = "medium"

# Таймаут исходящих вызовов других агентов
agent_call_timeout_sec = 120

# Ограничение контекста
prefix_message_count = 4
tail_message_count = 6

# "stateless" | "stateful"
agent_type = "stateful"

# Время жизни сессии в секундах (пока не используется)
session_ttl_secs = 1800

skill_mode = "auto"
skill_min_tool_calls = 2
skill_phrases_top_n = 15
skill_phrase_min_words = 2
skill_search_threshold = 0.45
skill_min_hits = 3

# Лимит бюджета в рублях (переопределяет глобальный)
max_cost_rub = 10.0

# Авто-инжект знаний (если не задано — берётся из глобальной секции)
knowledge_auto_top_n = 7
knowledge_auto_top_k = 3
knowledge_auto_threshold = 0.70
