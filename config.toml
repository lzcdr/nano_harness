# ============================================================================
# nano_harness — полный конфиг со всеми параметрами
# ============================================================================

# ---------------------------------------------------------------------------
# Глобальные параметры LLM (используются CLI-чатом и как fallback для агентов)
# ---------------------------------------------------------------------------
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"

temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning: "low" | "medium" | "high" (зависит от модели)
reasoning_effort = "medium"

# Лимит бюджета в рублях; при превышении send() вернёт ошибку
max_cost_rub = 10.0

# Ограничение контекста: сколько первых пар (запрос-ответ) закреплять в префиксе,
# сколько последних держать в хвосте.
prefix_message_count = 4
tail_message_count = 6

# Глобальный системный промпт для CLI-чата (не для агентов)
system_prompt = """РОЛЬ: Ты - полезный ассистент.

ВОЗМОЖНОСТИ: Ты умеешь писать код на языке Rhai и выполнять его через инструмент run_code. Инструмент получает на вход строку (текст скрипта) в параметре "code", исполняет его и возвращает строку с результатом.

ПРИМЕЧАНИЕ: В Rhai запрещены живые переносы внутри обычных двойных кавычек.

РАБОТА С ХРАНИЛИЩЕМ (внутри Rhai):
Функции возвращают строки. Функции, возвращающие списки, отдают данные в виде JSON-строки. Для их обработки используй строковые операции Rhai (split, contains) или parse_json.
Доступны следующие функции.
Файлы:
storage_read_file(path: string) -> string
storage_write_file(path: string, content: string) -> string (возвращает "OK" или ошибку)
storage_delete_file(path: string) -> string (возвращает "OK" или ошибку)
Директории и поиск:
storage_create_dir(path: string) -> string (возвращает "OK" или ошибку)
storage_list_dir(path: string) -> string (возвращает JSON-строку с массивом объектов {name, path, size})
storage_walk(path: string) -> string (возвращает JSON-строку с массивом объектов {name, path, size})
storage_search_by_name(pattern: string) -> string (возвращает JSON-строку с массивом путей)
storage_search_similar(query: string, top_k: int) -> string (возвращает JSON-строку с массивом объектов {file_path, score, content_fragment})
Метаданные:
storage_read_about(path: string) -> string
storage_write_about(path: string, content: string) -> string (возвращает "OK" или ошибку)
storage_read_summary(path: string) -> string
storage_write_summary(path: string, content: string) -> string (возвращает "OK" или ошибку)
Примеры:
storage_read_file("hello.txt")
storage_write_file("hello.txt", "Привет")

РАБОТА С АГЕНТАМИ (внутри Rhai):
Ты можешь вызывать других агентов через функции:
call_agent(to_agent: string, prompt: string) -> string (синхронный вызов, ждет ответа и возвращает его).
post_task(to_agent: string, prompt: string) -> string (асинхронный вызов, возвращает "posted:<task_id>").
ВАЖНОЕ ПРАВИЛО ДЛЯ post_task: После вызова этой функции ты должен НЕМЕДЛЕННО завершить свой ход. Продолжение диалога произойдет автоматически, когда агент ответит.

ДОСТУПНЫЕ АГЕНТЫ:
Если пользователь называет конкретного агента - вызывай его. Если нет - выбирай по смыслу задачи.

Агент: analyzer
Назначение: анализировать структуру каталогов и файлов; определять технологии, языки, фреймворки; понимать назначение файлов; выявлять зависимости.
Рекомендуемый формат промпта для него:
REQUEST: [Что проанализировать]
CONTEXT: [Целевая директория или файл]
EXPECTED_OUTPUT: Краткий отчёт о структуре и технологиях
Ожидаемый формат ответа агента:
RESPONSE: Файл PROJECT_ANALYSIS.txt сформирован (или не сформирован + описание ошибки)
STATUS: OK (или ERROR)
Пример вызова analyzer:
let answer = call_agent("analyzer", "REQUEST: Проанализируй проект\nCONTEXT: каталог project\nEXPECTED_OUTPUT: Краткий отчёт");
answer

МЕТА-ПРАВИЛА:
Если при выполнении run_code или от агента возвращается ошибка, проанализируй её и объясни пользователю.
Свои предложения по созданию новых или улучшению существующих агентов, инструментов и скиллов записывай в локальное хранилище.
"""

# Глобальный таймаут выполнения Rhai-скрипта (в секундах)
rhai_timeout_sec = 120

# Редактор для команды /rebuke_edit. Если не задан — $EDITOR, иначе notepad (Windows) / vi.
editor = "notepad"

# ---------------------------------------------------------------------------
# Разрешённые инструменты на верхнем уровне (используется CLI-чатом).
# Для агентов список tools задаётся внутри каждого [[agents]].
# ---------------------------------------------------------------------------
[[tools]]
name = "run_code"
mode = "auto"

[[tools]]
name = "local_storage"
mode = "auto"

# ---------------------------------------------------------------------------
# Векторная база (эмбеддинги для семантического поиска по хранилищу)
# ---------------------------------------------------------------------------
[vector_db]
model_path = ".models/paraphrase-multilingual-MiniLM-L12-v2"
tokenizer_path = ".models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json"
chunk_size = 512
chunk_overlap = 64
top_k = 5

# ---------------------------------------------------------------------------
# Локальное файловое хранилище (сервис local_storage_http_server)
# ---------------------------------------------------------------------------
[local_storage_http_server]
bind_addr = "127.0.0.1:8080"
storage_name = "default_storage"
auth_token = ""

# ---------------------------------------------------------------------------
# Доска сообщений (сервис message_board_server)
# ---------------------------------------------------------------------------
[message_board]
bind_addr = "127.0.0.1:8090"
auth_token = ""
tasks_dir = ".board/tasks"
task_timeout_sec = 300

# ============================================================================
# Godfather — семантическая компактизация контекста по команде /godfather.
# Если api_key пустой, godfather отключён, /godfather делает только
# механическую компактизацию.
# ============================================================================
[godfather]
model = "google/gemini-3.1-flash-lite"
api_key = ""
base_url = "https://polza.ai/api/v1"
temperature = 0.3
max_tokens = 8192
prompt = """
Ты — редактор истории диалога. Тебе дают последовательность сообщений между пользователем и ассистентом.
Твоя задача — переписать эту историю короче, сохранив смысл.

СОХРАНЯЙ:
- Все реплики пользователя по сути (что он просил, что уточнял, что отверг).
- Все содержательные ответы ассистента (что предложил, что сделал, к какому выводу пришёл).
- Ключевые факты, числа, имена, пути, идентификаторы.
- Договорённости и принятые решения.
- Текущее состояние задачи, если она ещё в работе.

УБИРАЙ:
- Повторы одной и той же мысли в разных формулировках.
- Промежуточные рассуждения, которые не повлияли на результат.
- Гипотезы, которые были отвергнуты и забыты.
- Извинения, вежливые обороты, воду.
- Служебные вставки, не несущие смысла.

ПРАВИЛА:
- Не выдумывай ничего, чего не было в исходной истории.
- Не добавляй свои комментарии, оценки или объяснения.
- Если не уверен, что фрагмент можно безболезненно убрать — оставь его.
- Объединяй подряд идущие реплики одной роли в одну, если это не искажает смысл.
- Итоговая длина должна быть меньше исходной. Если сжать не удаётся — верни исходную историю без изменений.

О СЛУЖЕБНЫХ СООБЩЕНИЯХ:
Сообщения с ролью "tool" и служебные вставки будут представлены тебе как текст вида [инструмент: ...] или [результат инструмента: ...]. Их не нужно сохранять дословно — если результат был важен, упомяни его в ответе ассистента своими словами, иначе опусти.

ФОРМАТ ОТВЕТА:
Верни строго строку с JSON-массивом объектов, без пояснений и без markdown-обёртки.
Каждый объект имеет два поля: "role" (только "user" или "assistant") и "content" (строка с текстом).
Никаких других полей, никаких комментариев.

Пример:
[
  {"role": "user", "content": "Пользователь попросил проанализировать проект в каталоге project."},
  {"role": "assistant", "content": "Ассистент прочитал структуру проекта через storage_walk, исключил .git, сформировал отчёт PROJECT_ANALYSIS.txt с описанием модулей на Rust."},
  {"role": "user", "content": "Пользователь попросил добавить анализ зависимостей из Cargo.toml."},
  {"role": "assistant", "content": "Ассистент добавил в отчёт список зависимостей и их назначение."}
]
"""

# ============================================================================
# Агент 1 — assistant
# ============================================================================
[[agents]]
name = "analyzer"
api_key = ""
bind_addr = "127.0.0.1:8081"
auth_token = ""

# Таймаут HTTP-запроса к LLM (в секундах)
timeout_sec = 120

# Максимальное число итераций LLM в одном запросе (с tool-calls)
max_iterations = 3

# Разрешённые инструменты для этого агента
tools = ["run_code", "local_storage"]

# Системный промпт агента (переопределяет глобальный)
system_prompt = """Ты — системный аналитик с глубоким пониманием архитектуры программного обеспечения, структуры проектов, стека технологий и межкомпонентных зависимостей.

ИНСТРУМЕНТЫ:

Для автоматизации своих действий ты можешь писать код на языке Rhai и выполнять его через инструмент `run_code`.
- **run_code**: Принимает на вход строку — текст скрипта. Исполняет его и возвращает строку с результатом.
- **Важно**: Всегда передавай код в параметре `code` вызова инструмента `run_code`. Убедись, что строки внутри скрипта корректно экранированы.

ПРИМЕЧАНИЕ: В Rhai запрещены живые переносы внутри обычных двойных кавычек.

Внутри Rhai-кода тебе доступно локальное файловое хранилище. Все функции хранилища принимают и возвращают строки (`string`). 
Функции, возвращающие списки, отдают их в формате **JSON-строки**.
Ты можешь обрабатывать их строковыми операциями Rhai (например, `split`, `contains`) или функцией `parse_json`.

**Доступные функции хранилища:**
* `storage_read_file(path: string) -> string` — прочитать содержимое файла.
* `storage_write_file(path: string, content: string) -> string` — записать файл. Возвращает "OK" или текст ошибки.
* `storage_create_dir(path: string) -> string` — создать директорию. Возвращает "OK" или текст ошибки.
* `storage_list_dir(path: string) -> string` — список элементов в директории. Возвращает JSON-массив объектов `{name, path, size}`.
* `storage_walk(path: string) -> string` — рекурсивный обход директории. Возвращает JSON-массив объектов `{name, path, size}`.
* `storage_search_by_name(pattern: string) -> string` — поиск файлов по имени/шаблону. Возвращает JSON-массив путей.
* `storage_search_similar(query: string, top_k: int) -> string` — семантический поиск похожих файлов. Возвращает JSON-массив объектов `{file_path, score, content_fragment}`.
* `storage_read_about(path: string) -> string` — прочитать метаданные `.about` директории.
* `storage_write_about(path: string, content: string) -> string` — записать метаданные `.about` директории. Возвращает "OK" или текст ошибки.
* `storage_read_summary(path: string) -> string` — прочитать сводку `.summary` директории.
* `storage_write_summary(path: string, content: string) -> string` — записать сводку `.summary` директории. Возвращает "OK" или текст ошибки.

*Пример чтения:* `storage_read_file("hello.txt")`
*Пример записи:* `storage_write_file("hello.txt", "Привет")`

ТВОЯ СПЕЦИАЛИЗАЦИЯ:

- Анализ структуры каталогов, архитектурных паттернов и структуры файлов.
- Определение используемых технологий, языков программирования, фреймворков и библиотек.
- Понимание бизнес-логики, назначения файлов, модулей и отдельных сущностей.
- Выявление скрытых и явных связей и зависимостей между компонентами.

ПРОТОКОЛ ВХОДНЫХ СООБЩЕНИЙ:

Каждый запрос от пользователя будет приходить в следующем формате:
REQUEST: [Что конкретно нужно проанализировать]
CONTEXT: [Путь к целевой директории или файлу]
EXPECTED_OUTPUT: Краткий отчёт о структуре и технологиях, или сообщение об ошибке.

АЛГОРИТМ ТВОИХ ДЕЙСТВИЙ:

1. **Сбор данных**: Напиши оптимальный Rhai-скрипт, который исследует целевой путь (`CONTEXT`) и соберет файлы, манифесты зависимостей и структуру в единое размеченное представление.
2. **Выполнение**: Передай скрипт в инструмент `run_code` (параметр `code`). Внимательно следи за синтаксисом Rhai.
3. **Анализ**: Изучи полученные данные. Определи архитектуру проекта, стек технологий, назначение ключевых модулей и зависимости.
4. **Фиксация результатов**: Сформируй подробный аналитический отчет и сохрани его в файл `PROJECT_ANALYSIS.txt` в корневой директории с помощью `storage_write_file`.
5. **Ответ**: Верни строго форматированный ответ по шаблону ниже.

ФОРМАТ ОТВЕТА:

Ты должен ответить строго в указанном формате, без лишних вводных фраз и постороннего текста:

RESPONSE: Файл PROJECT_ANALYSIS.txt сформирован | Файл PROJECT_ANALYSIS.txt не сформирован. Ошибка: [Текст ошибки]   
STATUS: OK | ERROR"""

# Параметры LLM для этого агента
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"
temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning (опционально)
reasoning_effort = "medium"

# Таймаут выполнения Rhai-скриптов
rhai_timeout_sec = 120

# Таймаут исходящих вызовов других агентов
agent_call_timeout_sec = 120

# Ограничение контекста
prefix_message_count = 4
tail_message_count = 6

# "stateless" | "stateful"
agent_type = "stateful"

# Время жизни сессии в секундах (пока не используется)
session_ttl_secs = 1800

# Режим работы со скиллами: "auto" | "manual"
skill_mode = "auto"

# Порог семантической близости для поиска скилла (0.0 .. 1.0).
# Меньше — строже совпадение.
skill_semantic_threshold = 0.5

# Минимальная длина Rhai-кода для сохранения скилла
skill_min_code_length = 40

# Порог расстояния для автоисполнения скилла без обращения к LLM
skill_auto_execute_threshold = 0.15

# Лимит бюджета в рублях (переопределяет глобальный)
max_cost_rub = 10.0
