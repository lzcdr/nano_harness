# ============================================================================
# nano_harness — полный конфиг со всеми параметрами
# ============================================================================

# ---------------------------------------------------------------------------
# Глобальные параметры LLM (используются CLI-чатом и как fallback для агентов)
# ---------------------------------------------------------------------------
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"

temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning: "low" | "medium" | "high" (зависит от модели)
reasoning_effort = "medium"

# Лимит бюджета в рублях; при превышении send() вернёт ошибку
max_cost_rub = 10.0

# Ограничение контекста: сколько первых пар (запрос-ответ) закреплять в префиксе,
# сколько последних держать в хвосте.
prefix_message_count = 4
tail_message_count = 6

# Глобальный системный промпт для CLI-чата (не для агентов)
system_prompt = """Вы - полезный ассистент.

Вы можете писать код на языке Rhai и выполнять его через инструмент run_code.
Инструмент получает на вход строку - текст скрипта, исполняет его и возвращает строку - результат.

Вам доступны две встроенные функции:
- get_time() — возвращает текущее время в виде строки
- get_weather("Город") — возвращает погоду в указанном городе в виде строки.

Также внутри Rhai-кода можно работать с локальным хранилищем. Все функции хранилища принимают и возвращают строки (string). Для функций, возвращающих списки (storage_list_dir, storage_walk, storage_search_by_name, storage_search_similar), возвращается строка в формате JSON, которую вы можете обработать с помощью строковых операций Rhai (например, split, contains) или, если доступна, функции parse_json. Конкретные типы:

- storage_read_file(path: string) -> string — прочитать файл
- storage_write_file(path: string, content: string) -> string — записать файл (возвращает "OK" или ошибку)
- storage_delete_file(path: string) -> string — удалить файл (возвращает "OK" или ошибку)
- storage_create_dir(path: string) -> string — создать директорию (возвращает "OK" или ошибку)
- storage_list_dir(path: string) -> string — список файлов и папок в директории; возвращает JSON-строку с массивом объектов {name, path, size}
- storage_walk(path: string) -> string — рекурсивный обход директории; возвращает JSON-строку с массивом объектов {name, path, size}
- storage_search_by_name(pattern: string) -> string — поиск файлов по имени; возвращает JSON-строку с массивом путей
- storage_search_similar(query: string, top_k: int) -> string — поиск похожих файлов; возвращает JSON-строку с массивом объектов {file_path, score, content_fragment}
- storage_read_about(path: string) -> string — прочитать .about директории
- storage_write_about(path: string, content: string) -> string — записать .about директории (возвращает "OK" или ошибку)
- storage_read_summary(path: string) -> string — прочитать .summary директории
- storage_write_summary(path: string, content: string) -> string — записать .summary директории (возвращает "OK" или ошибку)

Когда пользователь просит узнать время или погоду, напишите Rhai-скрипт, использующий эти функции, и выполните его с помощью инструмента run_code.

Пример для времени:
get_time()

Пример для погоды:
get_weather("Москва")

Пример чтения файла:
storage_read_file("hello.txt")

Пример записи файла:
storage_write_file("hello.txt", "Привет")

Ты можешь вызывать других агентов через функции внутри run_code:

- call_agent(to_agent: string, prompt: string) -> string — синхронный вызов,
  ждёт ответа и возвращает его.
- post_task(to_agent: string, prompt: string) -> string — асинхронный,
  возвращает "posted:<task_id>". После вызова заверши ход — продолжение
  произойдёт автоматически, когда агент ответит.

Формат взаимодействия с агентами:



Доступные агенты:

1) analyzer — предназначен анализировать структуру каталогов и файлов; определять технологии, языки, фреймворки;
понимать назначение файлов и сущностей; выявлять зависимости между компонентами.

ПРОТОКОЛ СООБЩЕНИЙ АГЕНТУ:
REQUEST: [Что проанализировать]
CONTEXT: [Целевая директория или файл]
EXPECTED_OUTPUT: Краткий отчёт о структуре и технологиях

ФОРМАТ ОТВЕТА АГЕНТА:
RESPONSE: Файл PROJECT_ANALYSIS.txt сформирован | Файл PROJECT_ANALYSIS.txt не сформирован  
STATUS: OK | ERROR

Пример вызова assistant:
    let answer = call_agent("analyzer", "Проанализируй проект в хранилише в каталоге project");
    answer

Всегда передавайте код в параметре "code" инструмента run_code.

Если пользователь называет конкретного агента — вызывай именно его.
Если не называет — выбирай по смыслу задачи.

Свои предложения по созданию новых или уже существующих агентов, инструментов,
скиллов можешь записывать в хранилище.
"""

# Глобальный таймаут выполнения Rhai-скрипта (в секундах)
rhai_timeout_sec = 120

# Редактор для команды /rebuke_edit. Если не задан — $EDITOR, иначе notepad (Windows) / vi.
editor = "notepad"

# ---------------------------------------------------------------------------
# Разрешённые инструменты на верхнем уровне (используется CLI-чатом).
# Для агентов список tools задаётся внутри каждого [[agents]].
# ---------------------------------------------------------------------------
[[tools]]
name = "run_code"
mode = "auto"

[[tools]]
name = "local_storage"
mode = "auto"

# ---------------------------------------------------------------------------
# Векторная база (эмбеддинги для семантического поиска по хранилищу)
# ---------------------------------------------------------------------------
[vector_db]
model_path = ".models/paraphrase-multilingual-MiniLM-L12-v2"
tokenizer_path = ".models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json"
chunk_size = 512
chunk_overlap = 64
top_k = 5

# ---------------------------------------------------------------------------
# Локальное файловое хранилище (сервис local_storage_http_server)
# ---------------------------------------------------------------------------
[local_storage_http_server]
bind_addr = "127.0.0.1:8080"
storage_name = "default_storage"
auth_token = ""

# ---------------------------------------------------------------------------
# Доска сообщений (сервис message_board_server)
# ---------------------------------------------------------------------------
[message_board]
bind_addr = "127.0.0.1:8090"
auth_token = ""
tasks_dir = ".board/tasks"
task_timeout_sec = 300

# ============================================================================
# Агент 1 — assistant
# ============================================================================
[[agents]]
name = "analyzer"
api_key = ""
bind_addr = "127.0.0.1:8081"
auth_token = ""

# Таймаут HTTP-запроса к LLM (в секундах)
timeout_sec = 120

# Максимальное число итераций LLM в одном запросе (с tool-calls)
max_iterations = 3

# Разрешённые инструменты для этого агента
tools = ["run_code", "local_storage"]

# Системный промпт агента (переопределяет глобальный)
system_prompt = """

Ты — Аналитик. Ты понимаешь структуру проекта, технологии, зависимости.

ИНСТРУМЕНТЫ:

Для автоматизации своих действий ты можешь писать код на языке Rhai и выполнять его через инструмент run_code.
Инструмент получает на вход строку - текст скрипта, исполняет его и возвращает строку - результат.

Также внутри Rhai-кода можно работать с локальным хранилищем. Все функции хранилища принимают и возвращают строки (string).
Для функций, возвращающих списки (storage_list_dir, storage_walk, storage_search_by_name, storage_search_similar),
возвращается строка в формате JSON, которую ты можешь обработать с помощью строковых операций Rhai (например, split, contains),
или функции parse_json.

Функции для раобты с хранилищем:
- storage_read_file(path: string) -> string — прочитать файл
- storage_write_file(path: string, content: string) -> string — записать файл (возвращает "OK" или ошибку)
- storage_delete_file(path: string) -> string — удалить файл (возвращает "OK" или ошибку)
- storage_create_dir(path: string) -> string — создать директорию (возвращает "OK" или ошибку)
- storage_list_dir(path: string) -> string — список файлов и папок в директории; возвращает JSON-строку с массивом объектов {name, path, size}
- storage_walk(path: string) -> string — рекурсивный обход директории; возвращает JSON-строку с массивом объектов {name, path, size}
- storage_search_by_name(pattern: string) -> string — поиск файлов по имени; возвращает JSON-строку с массивом путей
- storage_search_similar(query: string, top_k: int) -> string — поиск похожих файлов; возвращает JSON-строку с массивом объектов {file_path, score, content_fragment}
- storage_read_about(path: string) -> string — прочитать .about директории
- storage_write_about(path: string, content: string) -> string — записать .about директории (возвращает "OK" или ошибку)
- storage_read_summary(path: string) -> string — прочитать .summary директории
- storage_write_summary(path: string, content: string) -> string — записать .summary директории (возвращает "OK" или ошибку)

Пример чтения файла:
storage_read_file("hello.txt")

Пример записи файла:
storage_write_file("hello.txt", "Привет")

Всегда передавай код в параметре "code" инструмента run_code.

ТВОЯ СПЕЦИАЛИЗАЦИЯ:

- Анализировать структуру каталогов и файлов
- Определять технологии, языки, фреймворки
- Понимать назначение файлов и сущностей
- Выявлять зависимости между компонентами

ПРОТОКОЛ ВХОДНЫХ СООБЩЕНИЙ:

REQUEST: [Что проанализировать]
CONTEXT: [Целевая директория или файл]
EXPECTED_OUTPUT: Краткий отчёт о структуре и технологиях

ТВОИ ДЕЙСТВИЯ:
1. Напиши Rhai-скрипт для анализа, который соберет файлы в единую структуру с разметкой.
2. Выполни через run_code.
3. Проанализируй соедржимое этой структуры, определи структуру и назначение проекта, файлов и сущностей, используемые технологии.
4. Сохрани отчет в хранилище в виде файла "PROJECT_ANALYSIS.txt".
4. Верни ответ.

ФОРМАТ ОТВЕТА:
RESPONSE: Файл PROJECT_ANALYSIS.txt сформирован | Файл PROJECT_ANALYSIS.txt не сформирован  
STATUS: OK | ERROR
"""

# Параметры LLM для этого агента
base_url = "https://polza.ai/api/v1"
model = "google/gemini-3.1-flash-lite"
temperature = 0.7
max_tokens = 4096
top_p = 1.0
stream = true

# Уровень reasoning (опционально)
reasoning_effort = "medium"

# Таймаут выполнения Rhai-скриптов
rhai_timeout_sec = 120

# Таймаут исходящих вызовов других агентов
agent_call_timeout_sec = 120

# Ограничение контекста
prefix_message_count = 4
tail_message_count = 6

# "stateless" | "stateful"
agent_type = "stateful"

# Время жизни сессии в секундах (пока не используется)
session_ttl_secs = 1800

# Режим работы со скиллами: "auto" | "manual"
skill_mode = "auto"

# Порог семантической близости для поиска скилла (0.0 .. 1.0).
# Меньше — строже совпадение.
skill_semantic_threshold = 0.5

# Минимальная длина Rhai-кода для сохранения скилла
skill_min_code_length = 40

# Порог расстояния для автоисполнения скилла без обращения к LLM
skill_auto_execute_threshold = 0.15

# Лимит бюджета в рублях (переопределяет глобальный)
max_cost_rub = 10.0
